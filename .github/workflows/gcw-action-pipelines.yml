name: GCW Action Pipelines

on:
  workflow_dispatch:
    inputs:
      issue_dir:
        description: GCW issue directory, such as .gcw/issues/42
        required: true
        type: string
      pipeline:
        description: GCW Action pipeline to run
        required: true
        type: choice
        options:
          - issue-intake
          - issue-clarify
          - planning
          - machine-review
          - machine-feedback-loop
          - human-feedback-loop
          - review-complete
      priority:
        description: Triage priority for issue-intake
        required: false
        type: string
      summary:
        description: Triage or review request summary
        required: false
        type: string
      issue_actionable:
        description: Whether the issue has enough information to continue
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      clarifying_question:
        description: Question to record when the issue still needs clarification
        required: false
        type: string
      worktree_path:
        description: Issue worktree path to record during planning
        required: false
        type: string
      progress_comment_url:
        description: Hosted issue progress comment URL
        required: false
        type: string
      planning_commit_pushed:
        description: Whether the planning commit has already been pushed
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      machine_review_result:
        description: Machine review result
        required: false
        default: passed
        type: choice
        options:
          - passed
          - failed
      progress_section:
        description: Local self-review section heading
        required: false
        default: "## Local Self-Review"
        type: string
      base_branch:
        description: Readiness base branch
        required: false
        type: string
      commit_range:
        description: Readiness commit range
        required: false
        type: string
      title:
        description: Review request title
        required: false
        type: string
      issue_link:
        description: Review request issue link
        required: false
        type: string
      validation_command:
        description: Validation command
        required: false
        type: string
      validation_result:
        description: Validation result
        required: false
        type: string
      risks:
        description: Risks or reviewer notes
        required: false
        type: string
      scope:
        description: Optional readiness scope
        required: false
        type: string
      reviewer_notes:
        description: Optional reviewer notes
        required: false
        type: string
      review_complete_result:
        description: Review completion result
        required: false
        default: merged
        type: choice
        options:
          - merged
          - closed
          - accepted
      review_request_url:
        description: Hosted review request URL
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gcw-action-pipelines-${{ github.ref }}-${{ inputs.issue_dir }}
  cancel-in-progress: false

jobs:
  action-pipeline:
    runs-on: ubuntu-latest
    env:
      GCW_ISSUE_DIR: ${{ inputs.issue_dir }}
      GCW_PIPELINE: ${{ inputs.pipeline }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run GCW Action pipeline
        env:
          INPUT_PRIORITY: ${{ inputs.priority }}
          INPUT_SUMMARY: ${{ inputs.summary }}
          INPUT_ISSUE_ACTIONABLE: ${{ inputs.issue_actionable }}
          INPUT_CLARIFYING_QUESTION: ${{ inputs.clarifying_question }}
          INPUT_WORKTREE_PATH: ${{ inputs.worktree_path }}
          INPUT_PROGRESS_COMMENT_URL: ${{ inputs.progress_comment_url }}
          INPUT_PLANNING_COMMIT_PUSHED: ${{ inputs.planning_commit_pushed }}
          INPUT_MACHINE_REVIEW_RESULT: ${{ inputs.machine_review_result }}
          INPUT_PROGRESS_SECTION: ${{ inputs.progress_section }}
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          INPUT_COMMIT_RANGE: ${{ inputs.commit_range }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_ISSUE_LINK: ${{ inputs.issue_link }}
          INPUT_VALIDATION_COMMAND: ${{ inputs.validation_command }}
          INPUT_VALIDATION_RESULT: ${{ inputs.validation_result }}
          INPUT_RISKS: ${{ inputs.risks }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_REVIEWER_NOTES: ${{ inputs.reviewer_notes }}
          INPUT_REVIEW_COMPLETE_RESULT: ${{ inputs.review_complete_result }}
        run: |
          set -euo pipefail
          set +e
          python3 .agents/skills/gcw/scripts/gcw_pipeline.py "$GCW_PIPELINE" \
            --issue-dir "$GCW_ISSUE_DIR" \
            --runner-kind github-actions \
            --runner-id "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB" \
            --claim-ownership \
            --priority "$INPUT_PRIORITY" \
            --summary "$INPUT_SUMMARY" \
            --issue-actionable "$INPUT_ISSUE_ACTIONABLE" \
            --clarifying-question "$INPUT_CLARIFYING_QUESTION" \
            --worktree-path "$INPUT_WORKTREE_PATH" \
            --progress-comment-url "$INPUT_PROGRESS_COMMENT_URL" \
            --planning-commit-pushed "$INPUT_PLANNING_COMMIT_PUSHED" \
            --machine-review-result "$INPUT_MACHINE_REVIEW_RESULT" \
            --progress-section "$INPUT_PROGRESS_SECTION" \
            --base-branch "$INPUT_BASE_BRANCH" \
            --commit-range "$INPUT_COMMIT_RANGE" \
            --title "$INPUT_TITLE" \
            --issue-link "$INPUT_ISSUE_LINK" \
            --validation-command "$INPUT_VALIDATION_COMMAND" \
            --validation-result "$INPUT_VALIDATION_RESULT" \
            --risks "$INPUT_RISKS" \
            --scope "$INPUT_SCOPE" \
            --reviewer-notes "$INPUT_REVIEWER_NOTES" \
            --review-complete-result "$INPUT_REVIEW_COMPLETE_RESULT"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "GCW pipeline paused after a successful clarification step."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Render hosted artifacts
        run: |
          set -euo pipefail
          python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py progress-comment --issue-dir "$GCW_ISSUE_DIR" > /tmp/gcw-progress-comment.md
          python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py review-request --issue-dir "$GCW_ISSUE_DIR" > /tmp/gcw-review-request.md

      - name: Update issue progress comment
        if: ${{ inputs.progress_comment_url != '' }}
        env:
          INPUT_PROGRESS_COMMENT_URL: ${{ inputs.progress_comment_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment_id="${INPUT_PROGRESS_COMMENT_URL##*issuecomment-}"
          if [ "$comment_id" = "$INPUT_PROGRESS_COMMENT_URL" ]; then
            echo "progress_comment_url must include issuecomment-<id> for GitHub comment updates" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --method PATCH --field "body=$(cat /tmp/gcw-progress-comment.md)"

      - name: Update review request body
        if: ${{ inputs.review_request_url != '' }}
        env:
          INPUT_REVIEW_REQUEST_URL: ${{ inputs.review_request_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          review_number="${INPUT_REVIEW_REQUEST_URL##*/}"
          gh pr view "$review_number" --json body --jq '.body // ""' > /tmp/gcw-existing-review-request.md
          python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py merge-review-request --existing-file /tmp/gcw-existing-review-request.md --rendered-file /tmp/gcw-review-request.md > /tmp/gcw-merged-review-request.md
          gh pr edit "$review_number" --body-file /tmp/gcw-merged-review-request.md

      - name: Commit GCW issue evidence
        run: |
          set -euo pipefail
          git add "$GCW_ISSUE_DIR"
          if git diff --cached --quiet; then
            echo "No GCW issue evidence changes to commit."
          else
            git commit -m "Update GCW action pipeline evidence"
            git push
          fi
