name: GCW Issue Clarify

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
      issue_branch:
        description: Issue branch (default gcw/issue-<number>)
        required: false
        default: ""
      dry_run:
        description: Evaluate readiness only; do not record milestone
        type: boolean
        default: false
      profile:
        description: Readiness profile
        required: false
        default: enhancement

permissions:
  contents: read
  issues: write

concurrency:
  group: gcw-issue-clarify-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  clarify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ inputs.issue_branch != '' && inputs.issue_branch || format('gcw/issue-{0}', inputs.issue_number) }}

      - name: Prepare hosted step
        id: prepare
        run: |
          python3 .github/scripts/prepare_gcw_hosted_step.py \
            --step gcw-issue-clarify \
            --issue-number "${{ inputs.issue_number }}" \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}" \
            --issue-branch "${{ inputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report skip
        if: steps.prepare.outputs.should_run != 'true'
        run: echo "${{ steps.prepare.outputs.skip_reason }}"

      - name: Evaluate issue readiness
        if: steps.prepare.outputs.should_run == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .agents/skills/gcw-issue-clarify/scripts/evaluate_issue_readiness.py \
            --profile "${{ inputs.profile }}" \
            --platform github --repo "${{ github.repository }}" \
            --issue "${{ inputs.issue_number }}" \
            --output /tmp/clarify_gate.json \
            --question

      - name: Run GCW issue clarify step
        if: steps.prepare.outputs.should_run == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/clarify_options.json
          import json
          gate = json.load(open("/tmp/clarify_gate.json", encoding="utf-8"))
          options = {"gate_file": "/tmp/clarify_gate.json"}
          if gate.get("ok"):
              options["summary"] = "Hosted clarify gate passed."
          else:
              import subprocess
              question = subprocess.check_output(
                  [
                      "python3",
                      ".agents/skills/gcw-issue-clarify/scripts/evaluate_issue_readiness.py",
                      "--profile", "${{ inputs.profile }}",
                      "--platform", "github",
                      "--repo", "${{ github.repository }}",
                      "--issue", "${{ inputs.issue_number }}",
                      "--question",
                  ],
                  text=True,
              ).strip()
              options["question"] = question
          print(json.dumps(options))
          PY
          python3 .agents/skills/gcw/scripts/run_gcw_step.py --step gcw-issue-clarify \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}" \
            --options-file /tmp/clarify_options.json

      - name: Dry-run workflow validation
        if: steps.prepare.outputs.should_run == 'true' && inputs.dry_run
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py workflow \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}"
