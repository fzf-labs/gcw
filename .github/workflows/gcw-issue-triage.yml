name: GCW Issue Triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
      issue_branch:
        description: Issue branch (default gcw/issue-<number>)
        required: false
        default: ""
      dry_run:
        description: Validate only; do not record milestone
        type: boolean
        default: false
      classification_type:
        description: Fallback GCW classification type for dry-run metadata previews
        required: false
        default: enhancement
      classification_priority:
        description: Fallback GCW priority label for dry-run metadata previews
        required: false
        default: priority:p2
      classification_area:
        description: Optional fallback area label
        required: false
        default: ""
      labels_applied:
        description: Comma-separated fallback workflow labels
        required: false
        default: triaged
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: gcw-issue-triage-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        contains(github.event.issue.labels.*.name, 'gcw:executor-hosted') &&
        !contains(github.event.issue.labels.*.name, 'gcw:executor-local') &&
        (
          (github.event_name == 'issue_comment' && vars.AGENT_LOGIN != '' && contains(github.event.comment.body, format('@{0}', vars.AGENT_LOGIN)) && contains(github.event.issue.labels.*.name, 'gcw:run-triage')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'gcw:run-triage' && (vars.AGENT_LOGIN == '' || contains(github.event.issue.assignees.*.login, vars.AGENT_LOGIN))) ||
          (github.event.action == 'assigned' && github.event.assignee.login == vars.AGENT_LOGIN && contains(github.event.issue.labels.*.name, 'gcw:run-triage'))
        )
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      should_trigger: ${{ steps.event.outputs.should_trigger }}
      trigger_reason: ${{ steps.event.outputs.trigger_reason }}
      issue_number: ${{ steps.event.outputs.issue_number }}
      issue_branch: ${{ steps.prepare.outputs.issue_branch || steps.event.outputs.issue_branch }}
      dry_run: ${{ steps.event.outputs.dry_run }}
      should_run: ${{ steps.prepare.outputs.should_run }}
      skip_reason: ${{ steps.prepare.outputs.skip_reason }}
      phase: ${{ steps.prepare.outputs.phase }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve workflow inputs
        id: event
        env:
          AGENT_LOGIN: ${{ vars.AGENT_LOGIN }}
        run: |
          python3 .gcw/engine/hosted/gcw_workflow_event.py \
            --step gcw-issue-triage \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --agent-login "$AGENT_LOGIN" \
            --dispatch-issue-number "${{ inputs.issue_number || '' }}" \
            --dispatch-issue-branch "${{ inputs.issue_branch || '' }}" \
            --dispatch-dry-run "${{ inputs.dry_run || false }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when event does not match trigger contract
        if: steps.event.outputs.should_trigger != 'true'
        run: echo "${{ steps.event.outputs.trigger_reason }}"

      - name: Checkout issue branch
        if: steps.event.outputs.should_trigger == 'true'
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ steps.event.outputs.issue_branch != '' && steps.event.outputs.issue_branch || format('gcw/issue-{0}', steps.event.outputs.issue_number) }}
          fetch-depth: 0

      - name: Prepare hosted step
        if: steps.event.outputs.should_trigger == 'true'
        id: prepare
        run: |
          python3 .gcw/engine/hosted/prepare_gcw_hosted_step.py \
            --step gcw-issue-triage \
            --issue-number "${{ steps.event.outputs.issue_number }}" \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            --issue-branch "${{ steps.event.outputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report phase skip
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run != 'true'
        run: echo "${{ steps.prepare.outputs.skip_reason }}"

  classify:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_trigger == 'true' &&
      needs.preflight.outputs.should_run == 'true' &&
      needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout issue branch
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ needs.preflight.outputs.issue_branch }}
          fetch-depth: 0

      - name: Sync triage label definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .agents/skills/gcw-issue-triage/scripts/manage_triage_metadata.py sync \
            --platform github --repo "${{ github.repository }}"

      - name: Prepare issue handoff context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .gcw/engine/hosted/prepare_issue_handoff_context.py \
            --repo "${{ github.repository }}" \
            --issue "${{ needs.preflight.outputs.issue_number }}" \
            --step gcw-issue-triage \
            --issue-dir ".gcw/issues/${{ needs.preflight.outputs.issue_number }}" \
            --issue-branch "${{ needs.preflight.outputs.issue_branch }}" \
            --output-dir ".gcw-runtime/handoff"

      - name: Classify issue with Codex
        uses: ./.github/actions/gcw-run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          handoff_dir: .gcw-runtime/handoff
          prompt: |
            Classify the GitHub issue using handoff context files.
            Read .gcw-runtime/handoff/issue_context.json and issue_comments.txt.
            Follow .agents/skills/gcw-issue-triage/SKILL.md.
            Write JSON only to .gcw-runtime/handoff/triage_result.json with keys:
            classification_type, classification_priority, labels_applied (array),
            optional classification_area.
            Do not run git/gh or modify other files.

      - name: Validate triage result
        run: |
          python3 .gcw/engine/hosted/validate_handoff_json.py \
            --name triage_result.json --path .gcw-runtime/handoff/triage_result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcw-issue-triage-${{ github.run_id }}
          path: |
            .gcw-runtime/handoff/issue_context.json
            .gcw-runtime/handoff/issue_comments.txt
            .gcw-runtime/handoff/triage_result.json
          if-no-files-found: ignore

  finalize:
    needs: [preflight, classify]
    if: >-
      needs.preflight.outputs.should_trigger == 'true' &&
      needs.preflight.outputs.should_run == 'true' &&
      needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout issue branch
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ needs.preflight.outputs.issue_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: gcw-issue-triage-${{ github.run_id }}
          path: .gcw-runtime/handoff

      - name: Apply triage metadata
        id: remote_sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .gcw/engine/hosted/validate_handoff_json.py \
            --name triage_result.json --path .gcw-runtime/handoff/triage_result.json
          python3 .gcw/engine/hosted/apply_triage_from_handoff.py \
            --repo "${{ github.repository }}" \
            --issue "${{ needs.preflight.outputs.issue_number }}"

      - name: Run GCW issue triage step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/triage_options.json
          import json
          from pathlib import Path
          data = json.loads(Path(".gcw-runtime/handoff/triage_result.json").read_text(encoding="utf-8"))
          options = {
              "classification_type": data["classification_type"],
              "classification_priority": data["classification_priority"],
              "labels_applied": data.get("labels_applied") or [],
              "remote_sync_file": "/tmp/triage_remote_sync.json",
          }
          area = (data.get("classification_area") or "").strip()
          if area:
              options["classification_area"] = area
          print(json.dumps(options))
          PY
          python3 .agents/skills/gcw/scripts/run_gcw_step.py --step gcw-issue-triage \
            --issue-dir ".gcw/issues/${{ needs.preflight.outputs.issue_number }}" \
            --options-file /tmp/triage_options.json

      - name: Push GCW workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_dir=".gcw/issues/${{ needs.preflight.outputs.issue_number }}"
          python3 .gcw/engine/hosted/finalize_gcw_hosted_step.py commit-push \
            --paths "$issue_dir/events" "$issue_dir/workflow.json" \
            --message "gcw(${{ needs.preflight.outputs.issue_number }}): record issue triage" \
            --branch "${{ needs.preflight.outputs.issue_branch }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcw-issue-triage-finalize-${{ github.run_id }}
          path: |
            .gcw-runtime/handoff
            /tmp/triage_options.json
            /tmp/triage_remote_sync.json
          if-no-files-found: ignore

  dry-run:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_trigger == 'true' &&
      needs.preflight.outputs.should_run == 'true' &&
      needs.preflight.outputs.dry_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout issue branch
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ needs.preflight.outputs.issue_branch }}
          fetch-depth: 0

      - name: Dry-run workflow validation
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py workflow \
            --issue-dir ".gcw/issues/${{ needs.preflight.outputs.issue_number }}"
