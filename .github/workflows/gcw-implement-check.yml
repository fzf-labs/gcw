name: GCW Implement Check

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
      issue_branch:
        description: Issue branch (default gcw/issue-<number>)
        required: false
        default: ""
      dry_run:
        description: Validate only; do not record milestone
        type: boolean
        default: false
      payload_file:
        description: Path in repo to implement-check payload JSON (relative to workspace root)
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: gcw-implement-check-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  implement-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ inputs.issue_branch != '' && inputs.issue_branch || format('gcw/issue-{0}', inputs.issue_number) }}

      - name: Prepare hosted step
        id: prepare
        run: |
          python3 .github/scripts/prepare_gcw_hosted_step.py \
            --step gcw-implement-check \
            --issue-number "${{ inputs.issue_number }}" \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}" \
            --issue-branch "${{ inputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report skip
        if: steps.prepare.outputs.should_run != 'true'
        run: echo "${{ steps.prepare.outputs.skip_reason }}"

      - name: Validate workflow evidence
        if: steps.prepare.outputs.should_run == 'true'
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py workflow \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}"

      - name: Run GCW implement-check step
        if: steps.prepare.outputs.should_run == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload_file="${{ inputs.payload_file }}"
          if [ -z "$payload_file" ]; then
            echo "payload_file input is required when dry_run is false" >&2
            exit 1
          fi
          if [ ! -f "$payload_file" ]; then
            echo "payload file not found: $payload_file" >&2
            exit 1
          fi
          python3 .agents/skills/gcw/scripts/run_gcw_step.py --step gcw-implement-check \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}" \
            --options-file /dev/stdin <<EOF
          {"payload_file": "$payload_file"}
          EOF

      - name: Dry-run implement-check evidence
        if: steps.prepare.outputs.should_run == 'true' && inputs.dry_run
        continue-on-error: true
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py implement-check \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}"
