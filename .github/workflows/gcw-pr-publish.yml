name: GCW PR Publish

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
      issue_branch:
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gcw-pr-publish-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        (
          (github.event_name == 'issue_comment' && vars.AGENT_LOGIN != '' && contains(github.event.comment.body, format('@{0}', vars.AGENT_LOGIN)) && contains(github.event.issue.labels.*.name, 'gcw:run-pr-publish')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'gcw:run-pr-publish' && (vars.AGENT_LOGIN == '' || contains(github.event.issue.assignees.*.login, vars.AGENT_LOGIN))) ||
          (github.event.action == 'assigned' && github.event.assignee.login == vars.AGENT_LOGIN && contains(github.event.issue.labels.*.name, 'gcw:run-pr-publish'))
        )
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve workflow inputs
        id: event
        env:
          AGENT_LOGIN: ${{ vars.AGENT_LOGIN }}
        run: |
          python3 .github/scripts/gcw_workflow_event.py \
            --step gcw-pr-publish \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --agent-login "$AGENT_LOGIN" \
            --dispatch-issue-number "${{ inputs.issue_number || '' }}" \
            --dispatch-issue-branch "${{ inputs.issue_branch || '' }}" \
            --dispatch-dry-run "${{ inputs.dry_run || false }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when event does not match trigger contract
        if: steps.event.outputs.should_trigger != 'true'
        run: echo "${{ steps.event.outputs.trigger_reason }}"

      - name: Checkout issue branch
        if: steps.event.outputs.should_trigger == 'true'
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ steps.event.outputs.issue_branch != '' && steps.event.outputs.issue_branch || format('gcw/issue-{0}', steps.event.outputs.issue_number) }}

      - name: Prepare hosted step
        if: steps.event.outputs.should_trigger == 'true'
        id: prepare
        run: |
          python3 .github/scripts/prepare_gcw_hosted_step.py \
            --step gcw-pr-publish \
            --issue-number "${{ steps.event.outputs.issue_number }}" \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            --issue-branch "${{ steps.event.outputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report phase skip
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run != 'true'
        run: echo "${{ steps.prepare.outputs.skip_reason }}"

      - name: Validate implement-check evidence
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true'
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py implement-check \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}"

      - name: Render review request preview
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true'
        run: |
          python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py review-request \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            > /tmp/gcw_review_request.md

      - name: Upsert pull request
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.event.outputs.dry_run != 'true'
        id: upsert_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(python3 -c 'import json; from pathlib import Path; p=Path(".gcw/issues/${{ steps.event.outputs.issue_number }}/implement-check-payload.json"); d=json.loads(p.read_text()); print(d.get("review_request",{}).get("title","gcw: review request"))')"
          python3 .github/scripts/finalize_gcw_hosted_step.py upsert-pr \
            --repo "${{ github.repository }}" \
            --branch "${{ steps.prepare.outputs.issue_branch }}" \
            --title "$title" \
            --body-file /tmp/gcw_review_request.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Run GCW pr-publish step
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true' && steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          review_url="${{ steps.upsert_pr.outputs.review_request_url }}"
          if [ -z "$review_url" ]; then
            echo "review_request_url is required" >&2
            exit 1
          fi
          python3 .agents/skills/gcw/scripts/run_gcw_step.py --step gcw-pr-publish \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            --options-file /dev/stdin <<EOF
          {"review_request_url": "$review_url", "target": "github_pr"}
          EOF

      - name: Push GCW workflow state
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true' && steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_dir=".gcw/issues/${{ steps.event.outputs.issue_number }}"
          python3 .github/scripts/finalize_gcw_hosted_step.py commit-push \
            --paths "$issue_dir/events" "$issue_dir/workflow.json" \
            --message "gcw(${{ steps.event.outputs.issue_number }}): record PR publish" \
            --branch "${{ steps.prepare.outputs.issue_branch }}"

      - name: Dry-run pr-publish evidence
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true' && steps.event.outputs.dry_run == 'true'
        continue-on-error: true
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py pr-publish \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}"
