name: GCW Implement

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
      issue_branch:
        description: Issue branch (default gcw/issue-<number>)
        required: false
        default: ""
      dry_run:
        description: Validate only; do not record milestone
        type: boolean
        default: false
      work_summary:
        description: Summary of the implementation advance (handoff from local agent)
        required: true
      feedback_source:
        description: Optional feedback source when resuming from changes-requested
        required: false
        default: ""
      feedback_ref:
        description: Optional feedback reference URL or id
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: gcw-implement-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ inputs.issue_branch != '' && inputs.issue_branch || format('gcw/issue-{0}', inputs.issue_number) }}

      - name: Prepare hosted step
        id: prepare
        run: |
          python3 .github/scripts/prepare_gcw_hosted_step.py \
            --step gcw-implement \
            --issue-number "${{ inputs.issue_number }}" \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}" \
            --issue-branch "${{ inputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report skip
        if: steps.prepare.outputs.should_run != 'true'
        run: echo "${{ steps.prepare.outputs.skip_reason }}"

      - name: Validate workflow evidence
        if: steps.prepare.outputs.should_run == 'true'
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py workflow \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}"

      - name: Record GCW implement milestone
        if: steps.prepare.outputs.should_run == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/implement_milestone.json
          import json
          print(json.dumps({"work_summary": """${{ inputs.work_summary }}"""}))
          PY
          result="$(python3 .agents/skills/gcw/scripts/publish_progress_comment.py \
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}" \
            --milestone-event gcw-implement \
            --milestone-payload-file /tmp/implement_milestone.json)"
          url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["progress_comment_url"])' <<<"$result")"
          args=(
            --issue-dir ".gcw/issues/${{ inputs.issue_number }}"
            --work-summary "${{ inputs.work_summary }}"
            --progress-comment-url "$url"
          )
          feedback_source="${{ inputs.feedback_source }}"
          feedback_ref="${{ inputs.feedback_ref }}"
          if [ -n "$feedback_source" ]; then
            args+=(--feedback-source "$feedback_source")
          fi
          if [ -n "$feedback_ref" ]; then
            args+=(--feedback-ref "$feedback_ref")
          fi
          python3 .agents/skills/gcw/scripts/manage_gcw_workflow.py record-implement "${args[@]}"
