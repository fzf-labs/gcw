name: GCW Implement

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
      issue_branch:
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false
      feedback_source:
        required: false
        default: ""
      feedback_ref:
        required: false
        default: ""
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: gcw-implement-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        contains(github.event.issue.labels.*.name, 'gcw:executor-hosted') &&
        !contains(github.event.issue.labels.*.name, 'gcw:executor-local') &&
        (
          (github.event_name == 'issue_comment' && vars.AGENT_LOGIN != '' && contains(github.event.comment.body, format('@{0}', vars.AGENT_LOGIN)) && contains(github.event.issue.labels.*.name, 'gcw:run-implement')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'gcw:run-implement' && (vars.AGENT_LOGIN == '' || contains(github.event.issue.assignees.*.login, vars.AGENT_LOGIN))) ||
          (github.event.action == 'assigned' && github.event.assignee.login == vars.AGENT_LOGIN && contains(github.event.issue.labels.*.name, 'gcw:run-implement'))
        )
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve workflow inputs
        id: event
        env:
          AGENT_LOGIN: ${{ vars.AGENT_LOGIN }}
        run: |
          python3 .gcw/engine/hosted/gcw_workflow_event.py \
            --step gcw-implement \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --agent-login "$AGENT_LOGIN" \
            --dispatch-issue-number "${{ inputs.issue_number || '' }}" \
            --dispatch-issue-branch "${{ inputs.issue_branch || '' }}" \
            --dispatch-dry-run "${{ inputs.dry_run || false }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when event does not match trigger contract
        if: steps.event.outputs.should_trigger != 'true'
        run: echo "${{ steps.event.outputs.trigger_reason }}"

      - name: Checkout issue branch
        if: steps.event.outputs.should_trigger == 'true'
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ steps.event.outputs.issue_branch != '' && steps.event.outputs.issue_branch || format('gcw/issue-{0}', steps.event.outputs.issue_number) }}
          fetch-depth: 0

      - name: Prepare hosted step
        if: steps.event.outputs.should_trigger == 'true'
        id: prepare
        run: |
          python3 .gcw/engine/hosted/prepare_gcw_hosted_step.py \
            --step gcw-implement \
            --issue-number "${{ steps.event.outputs.issue_number }}" \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            --issue-branch "${{ steps.event.outputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report phase skip
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run != 'true'
        run: |
          python3 .gcw/engine/hosted/report_gcw_skip.py \
            --step "gcw-implement" \
            --skip-gate "${{ steps.prepare.outputs.skip_gate }}" \
            --skip-reason "${{ steps.prepare.outputs.skip_reason }}" \
            --phase "${{ steps.prepare.outputs.phase }}"

      - name: Validate workflow evidence
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true'
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py workflow \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}"

      - name: Prepare issue handoff context
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .gcw/engine/hosted/prepare_issue_handoff_context.py \
            --repo "${{ github.repository }}" \
            --issue "${{ steps.event.outputs.issue_number }}" \
            --step gcw-implement \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            --issue-branch "${{ steps.prepare.outputs.issue_branch }}"

      - name: Implement with Codex
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.event.outputs.dry_run != 'true'
        uses: ./.github/actions/gcw-run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          handoff_dir: .gcw-runtime/handoff
          prompt: |
            Implement the GCW issue per task_plan.md and .agents/skills/gcw-implement/SKILL.md.
            Use issue_context.json and issue_comments.txt for context.
            Write code and tests only; do not run git/gh.
            Write .gcw-runtime/handoff/implement_summary.json with key work_summary describing changes.

      - name: Commit and push implementation
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .gcw/engine/hosted/finalize_gcw_hosted_step.py commit-push-all \
            --message "feat(gcw): implement issue #${{ steps.event.outputs.issue_number }}" \
            --branch "${{ steps.prepare.outputs.issue_branch }}" \
            --exclude .gcw-runtime

      - name: Record GCW implement milestone
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true' && steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .gcw/engine/hosted/validate_handoff_json.py \
            --name implement_summary.json \
            --path .gcw-runtime/handoff/implement_summary.json
          python3 .gcw/engine/hosted/record_implement_milestone.py \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}" \
            --feedback-source "${{ inputs.feedback_source }}" \
            --feedback-ref "${{ inputs.feedback_ref }}"

      - name: Push GCW workflow state
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true' && steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_dir=".gcw/issues/${{ steps.event.outputs.issue_number }}"
          python3 .gcw/engine/hosted/finalize_gcw_hosted_step.py commit-push \
            --paths "$issue_dir/events" "$issue_dir/workflow.json" \
            --message "gcw(${{ steps.event.outputs.issue_number }}): record implementation" \
            --branch "${{ steps.prepare.outputs.issue_branch }}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.event.outputs.should_trigger == 'true'
        with:
          name: gcw-implement-${{ github.run_id }}
          path: |
            .gcw-runtime/handoff
          if-no-files-found: ignore
