name: GCW PR Review

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
      issue_branch:
        required: false
        default: ""
      pr_number:
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false
      result:
        default: passed
      reason:
        default: ""
      ai_review:
        description: Run optional Codex AI review summary
        type: boolean
        default: false
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: gcw-pr-review-${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'gcw/issue-')) ||
      (
        github.event.issue.pull_request == null &&
        (
          (github.event_name == 'issue_comment' && vars.AGENT_LOGIN != '' && contains(github.event.comment.body, format('@{0}', vars.AGENT_LOGIN)) && contains(github.event.issue.labels.*.name, 'gcw:run-pr-review')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'gcw:run-pr-review' && (vars.AGENT_LOGIN == '' || contains(github.event.issue.assignees.*.login, vars.AGENT_LOGIN))) ||
          (github.event.action == 'assigned' && github.event.assignee.login == vars.AGENT_LOGIN && contains(github.event.issue.labels.*.name, 'gcw:run-pr-review'))
        )
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve workflow inputs
        id: event
        env:
          AGENT_LOGIN: ${{ vars.AGENT_LOGIN }}
        run: |
          python3 .github/scripts/gcw_workflow_event.py \
            --step gcw-pr-review \
            --event-name "${{ github.event_name }}" \
            --event-path "$GITHUB_EVENT_PATH" \
            --agent-login "$AGENT_LOGIN" \
            --dispatch-issue-number "${{ inputs.issue_number || '' }}" \
            --dispatch-issue-branch "${{ inputs.issue_branch || '' }}" \
            --dispatch-dry-run "${{ inputs.dry_run || false }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when event does not match trigger contract
        if: steps.event.outputs.should_trigger != 'true'
        run: echo "${{ steps.event.outputs.trigger_reason }}"

      - name: Checkout issue branch
        if: steps.event.outputs.should_trigger == 'true'
        uses: ./.github/actions/gcw-setup
        with:
          ref: ${{ steps.event.outputs.issue_branch != '' && steps.event.outputs.issue_branch || format('gcw/issue-{0}', steps.event.outputs.issue_number) }}
          fetch-depth: 0

      - name: Prepare hosted step
        if: steps.event.outputs.should_trigger == 'true'
        id: prepare
        run: |
          issue_number="${{ steps.event.outputs.issue_number }}"
          if [ -z "$issue_number" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.head_ref }}"
            issue_number="${branch#gcw/issue-}"
          fi
          python3 .github/scripts/prepare_gcw_hosted_step.py \
            --step gcw-pr-review \
            --issue-number "$issue_number" \
            --issue-dir ".gcw/issues/$issue_number" \
            --issue-branch "${{ steps.event.outputs.issue_branch }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report phase skip
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run != 'true'
        run: echo "${{ steps.prepare.outputs.skip_reason }}"

      - name: Run repository unit tests
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true'
        run: python3 -m unittest discover -s .agents/skills/gcw/tests

      - name: Validate workflow evidence
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true'
        run: |
          issue_number="${{ steps.event.outputs.issue_number }}"
          if [ -z "$issue_number" ]; then issue_number="${{ github.head_ref }}"; issue_number="${issue_number#gcw/issue-}"; fi
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py workflow \
            --issue-dir ".gcw/issues/$issue_number"

      - name: Validate pr-publish evidence
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.prepare.outputs.validate_command == 'pr-publish'
        run: |
          issue_number="${{ steps.event.outputs.issue_number }}"
          if [ -z "$issue_number" ]; then issue_number="${{ github.head_ref }}"; issue_number="${issue_number#gcw/issue-}"; fi
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py pr-publish \
            --issue-dir ".gcw/issues/$issue_number"

      - name: Validate review-check evidence
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.prepare.outputs.validate_command == 'review-check'
        run: |
          issue_number="${{ steps.event.outputs.issue_number }}"
          if [ -z "$issue_number" ]; then issue_number="${{ github.head_ref }}"; issue_number="${issue_number#gcw/issue-}"; fi
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py review-check \
            --issue-dir ".gcw/issues/$issue_number"

      - name: Optional AI review summary
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          inputs.ai_review == true
        uses: ./.github/actions/gcw-run-codex
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          handoff_dir: .gcw-runtime/handoff
          prompt: |
            Summarize PR review risks and validation results for GCW pr-review step.
            Write .gcw-runtime/handoff/pr_review_summary.json with keys result and reason.
            Do not run git/gh.

      - name: Run GCW pr-review step
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.prepare.outputs.run_mode == 'full' &&
          steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GCW_ACTOR_KIND: github-actions
          GCW_ACTOR_ID: github-actions
        run: |
          issue_number="${{ steps.event.outputs.issue_number }}"
          if [ -z "$issue_number" ]; then issue_number="${{ github.head_ref }}"; issue_number="${issue_number#gcw/issue-}"; fi
          result="${{ inputs.result }}"
          reason="${{ inputs.reason }}"
          if [ -f .gcw-runtime/handoff/pr_review_summary.json ]; then
            result="$(python3 .github/scripts/validate_handoff_json.py --name pr_review_summary.json --path .gcw-runtime/handoff/pr_review_summary.json --print-field result)"
            reason="$(python3 .github/scripts/validate_handoff_json.py --name pr_review_summary.json --path .gcw-runtime/handoff/pr_review_summary.json --print-field reason || true)"
          fi
          python3 - <<PY > /tmp/pr_review_options.json
          import json
          options = {"result": "$result", "feedback_source": "pr-review"}
          reason = """$reason""".strip()
          if reason:
              options["reason"] = reason
          print(json.dumps(options))
          PY
          python3 .agents/skills/gcw/scripts/run_gcw_step.py --step gcw-pr-review \
            --issue-dir ".gcw/issues/$issue_number" \
            --options-file /tmp/pr_review_options.json

      - name: Push GCW workflow state
        if: >-
          steps.event.outputs.should_trigger == 'true' &&
          steps.prepare.outputs.should_run == 'true' &&
          steps.prepare.outputs.record_step == 'true' &&
          steps.event.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="${{ steps.event.outputs.issue_number }}"
          if [ -z "$issue_number" ]; then issue_number="${{ github.head_ref }}"; issue_number="${issue_number#gcw/issue-}"; fi
          issue_dir=".gcw/issues/$issue_number"
          python3 .github/scripts/finalize_gcw_hosted_step.py commit-push \
            --paths "$issue_dir/events" "$issue_dir/workflow.json" \
            --message "gcw($issue_number): record PR review" \
            --branch "${{ steps.prepare.outputs.issue_branch }}"

      - name: Dry-run review-check evidence
        if: steps.event.outputs.should_trigger == 'true' && steps.prepare.outputs.should_run == 'true' && steps.event.outputs.dry_run == 'true'
        continue-on-error: true
        run: |
          python3 .agents/skills/gcw/scripts/validate_gcw_evidence.py review-check \
            --issue-dir ".gcw/issues/${{ steps.event.outputs.issue_number }}"
