name: GCW Run Codex
description: Run openai/codex-action with GCW sandbox prerequisites.

inputs:
  prompt:
    description: Prompt passed to codex-action
    required: true
  handoff_dir:
    description: Directory containing issue_context.json and issue_comments.txt
    required: true
  openai-api-key:
    description: OpenAI API key for codex-action
    required: true

runs:
  using: composite
  steps:
    - name: Install Codex sandbox prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap

    - name: Configure Codex API endpoint
      id: codex_endpoint
      shell: bash
      env:
        OPENAI_API_ENDPOINT: ${{ vars.OPENAI_API_ENDPOINT }}
      run: |
        endpoint="${OPENAI_API_ENDPOINT%/}"
        if [ -z "$endpoint" ]; then
          echo "OPENAI_API_ENDPOINT is not set" >&2
          exit 1
        fi
        case "$endpoint" in
          */responses) ;;
          *) endpoint="$endpoint/responses" ;;
        esac
        echo "url=$endpoint" >> "$GITHUB_OUTPUT"

    - name: Run Codex agent
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        responses-api-endpoint: ${{ steps.codex_endpoint.outputs.url }}
        prompt: ${{ inputs.prompt }}
