gcw:action-pipeline:
  stage: apply
  image: python:3.12
  variables:
    PYTHONPYCACHEPREFIX: /tmp/gcw-pycache
  rules:
    - if: '$GCW_PIPELINE != ""'
      when: manual
    - when: never
  script:
    - |
      set -euo pipefail
      case "${GCW_PIPELINE:-}" in
        issue-intake|issue-clarify|planning|machine-review|machine-feedback-loop|human-feedback-loop|review-complete)
          ;;
        *)
          echo "Unsupported GCW_PIPELINE: ${GCW_PIPELINE:-}" >&2
          exit 1
          ;;
      esac
      python3 .agents/skills/gcw/scripts/gcw_pipeline.py "$GCW_PIPELINE" \
        --issue-dir "$GCW_ISSUE_DIR" \
        --runner-kind gitlab-ci \
        --runner-id "${CI_PIPELINE_ID}:${CI_JOB_ID}" \
        --claim-ownership \
        --priority "${GCW_PRIORITY:-}" \
        --summary "${GCW_SUMMARY:-}" \
        --issue-actionable "${GCW_ISSUE_ACTIONABLE:-true}" \
        --clarifying-question "${GCW_CLARIFYING_QUESTION:-}" \
        --worktree-path "${GCW_WORKTREE_PATH:-}" \
        --progress-comment-url "${GCW_PROGRESS_COMMENT_URL:-}" \
        --planning-commit-pushed "${GCW_PLANNING_COMMIT_PUSHED:-false}" \
        --machine-review-result "${GCW_MACHINE_REVIEW_RESULT:-passed}" \
        --progress-section "${GCW_PROGRESS_SECTION:-## Local Self-Review}" \
        --base-branch "${GCW_BASE_BRANCH:-}" \
        --commit-range "${GCW_COMMIT_RANGE:-}" \
        --title "${GCW_TITLE:-}" \
        --issue-link "${GCW_ISSUE_LINK:-}" \
        --validation-command "${GCW_VALIDATION_COMMAND:-}" \
        --validation-result "${GCW_VALIDATION_RESULT:-}" \
        --risks "${GCW_RISKS:-}" \
        --scope "${GCW_SCOPE:-}" \
        --reviewer-notes "${GCW_REVIEWER_NOTES:-}" \
        --review-complete-result "${GCW_REVIEW_COMPLETE_RESULT:-merged}"
    - |
      set -euo pipefail
      python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py progress-comment --issue-dir "$GCW_ISSUE_DIR" > /tmp/gcw-progress-comment.md
      python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py review-request --issue-dir "$GCW_ISSUE_DIR" > /tmp/gcw-review-request.md
    - |
      set -euo pipefail
      auth_header="JOB-TOKEN: $CI_JOB_TOKEN"
      if [ -n "${GITLAB_TOKEN:-}" ]; then
        auth_header="PRIVATE-TOKEN: $GITLAB_TOKEN"
      fi
      if [ -n "${GCW_PROGRESS_NOTE_ID:-}" ] && [ -n "${GCW_ISSUE_IID:-}" ]; then
        curl --request PUT --fail --header "$auth_header" --data-urlencode "body@/tmp/gcw-progress-comment.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$GCW_ISSUE_IID/notes/$GCW_PROGRESS_NOTE_ID"
      fi
      if [ -n "${GCW_MERGE_REQUEST_IID:-}" ]; then
        curl --fail --header "$auth_header" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$GCW_MERGE_REQUEST_IID" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("description") or "")' > /tmp/gcw-existing-review-request.md
        python3 .agents/skills/gcw/scripts/render_gcw_hosted_artifacts.py merge-review-request --existing-file /tmp/gcw-existing-review-request.md --rendered-file /tmp/gcw-review-request.md > /tmp/gcw-merged-review-request.md
        curl --request PUT --fail --header "$auth_header" --data-urlencode "description@/tmp/gcw-merged-review-request.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$GCW_MERGE_REQUEST_IID"
      fi
    - |
      set -euo pipefail
      git add "$GCW_ISSUE_DIR"
      if git diff --cached --quiet; then
        echo "No GCW issue evidence changes to commit."
      else
        git config user.name "gitlab-ci"
        git config user.email "gitlab-ci@example.invalid"
        git commit -m "Update GCW action pipeline evidence"
        git push origin "HEAD:$CI_COMMIT_REF_NAME"
      fi
